<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brick Atölyesi | geceleriesen.com</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap">
<style>
:root{--bg:#e6eaf0;--panel:#fff;--ink:#18202e;--mut:#667085;--line:#d5dbe4;--acc:#f2c80f;--accink:#18202e;--scene:#dfe5ee;--btn:#f1f4f8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d121b;--panel:#151c29;--ink:#e8edf5;--mut:#8b96a9;--line:#263044;--scene:#1a2232;--btn:#1e2738;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d121b;--panel:#151c29;--ink:#e8edf5;--mut:#8b96a9;--line:#263044;--scene:#1a2232;--btn:#1e2738;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:14px}
aside{width:272px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px 14px 20px}
h1{font-size:20px;font-weight:900;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 14px;font-size:12.5px}
h2{font-size:13px;font-weight:900;margin:16px 0 7px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button,input{font:inherit;color:inherit}
button{background:var(--btn);border:1.5px solid var(--line);border-radius:8px;padding:8px 2px;font-weight:700;cursor:pointer}
button:hover{border-color:var(--mut)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.row{display:flex;gap:6px;align-items:center}
.row input[type=number]{width:54px;padding:7px 6px;border:1.5px solid var(--line);border-radius:8px;background:var(--btn)}
.row button{flex:1}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.sw button{aspect-ratio:1;padding:0;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18)}
.sw button.on{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ic{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;padding:6px 1px 5px}.ic svg{width:34px;height:40px;display:block}
.keys{color:var(--mut);font-size:12px;line-height:1.7;margin-top:16px}
kbd{background:var(--btn);border:1px solid var(--line);border-radius:4px;padding:0 5px;font:inherit;font-weight:700;color:var(--ink)}
main{flex:1;position:relative;min-width:0;background:var(--scene)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#cnt{position:absolute;left:14px;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px}
#mode{position:absolute;right:14px;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px}
@media(max-width:760px){body{flex-direction:column-reverse}aside{width:100%;height:42%;border-right:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<aside>
<h1>Brick Atölyesi</h1>
<p class="sub">Parçayı seç, alana tıkla, inşa et.</p>

<h2>Tuğla ölçüleri</h2>
<div class="grid" id="sizes"></div>
<div class="row" style="margin-top:8px">
<input type="number" id="cw" min="1" max="16" value="2" aria-label="Genişlik">
<span>×</span>
<input type="number" id="cd" min="1" max="16" value="5" aria-label="Uzunluk">
<button id="cbtn">Özel ölçü</button>
</div>
<div class="two" style="margin-top:8px">
<button id="tBrick" class="on">Tuğla</button><button id="tPlate">İnce plaka</button>
</div>

<h2>Özel parçalar</h2>
<div class="grid" id="specials"></div>

<h2>Renk</h2>
<div class="sw" id="sw"></div>

<h2>Araçlar</h2>
<div class="two">
<button id="bRot">Döndür</button><button id="bDel">Silme modu</button>
<button id="bUndo">Geri al</button><button id="bClear">Temizle</button>
</div>

<div class="keys">
<kbd>R</kbd> döndür &nbsp; <kbd>X</kbd> silme modu<br>
<kbd>Ctrl</kbd>+<kbd>Z</kbd> geri al<br>
Sürükle: kamerayı çevir<br>
Tekerlek: yakınlaştır<br>
Tıkla: yerleştir
</div>
</aside>
<main id="stage"><canvas id="c"></canvas><div id="cnt"></div><div id="mode"></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const U=0.4,N=32,H2=N/2;
const COLORS=['#d92f2f','#f28c1b','#f2c80f','#3fa34d','#1f6fd1','#7a3fb5','#ec6fa8','#f4f4f0','#8a8f98','#2b2f36','#7b4a2a','#2fb5b5'];
const F={w:1,d:1,h:8},SPEC={tree:{w:3,d:3,h:12},window:{w:2,d:1,h:6},door:{w:2,d:1,h:9},casual:F,police:F,fire:F,worker:F,suit:F};
const FIGV={police:{t:'#1b2a5c',l:'#1b2a5c',hat:'cap',hc:'#1b2a5c'},fire:{t:'#d92f2f',l:'#2b2f36',hat:'helmet',hc:'#f2c80f'},worker:{t:'#f28c1b',l:'#1f6fd1',hat:'helmet',hc:'#f2c80f'},suit:{t:'#2b2f36',l:'#2b2f36',hat:'hair',hc:'#4a2f1a',tie:1},casual:{t:null,l:'#1f6fd1',hat:'hair',hc:'#6b4a2a'}};
FIGV.figure=FIGV.casual;
function icon(k,c){
  const s=b=>'<svg viewBox="0 0 34 40" xmlns="http://www.w3.org/2000/svg">'+b+'</svg>';
  if(k==='tree')return s('<rect x="15" y="28" width="4" height="10" fill="#7b4a2a"/><path d="M17 2 9 13h16z" fill="#2f8a46"/><path d="M17 8 6 21h22z" fill="#2f8a46"/><path d="M17 15 4 30h26z" fill="#2f8a46"/>');
  if(k==='window')return s('<rect x="6" y="8" width="22" height="26" fill="#8fd0ff" stroke="'+c+'" stroke-width="4"/><path d="M17 8v26M6 21h22" stroke="'+c+'" stroke-width="2"/>');
  if(k==='door')return s('<rect x="6" y="4" width="22" height="33" fill="#f4f4f0" stroke="#8a8f98"/><rect x="9" y="7" width="16" height="30" fill="'+c+'"/><circle cx="22" cy="23" r="1.7" fill="#e3b505"/>');
  const v=FIGV[k],t=v.t||c;let h='';
  h+='<rect x="6" y="15" width="4" height="11" fill="'+t+'"/><rect x="24" y="15" width="4" height="11" fill="'+t+'"/><rect x="10" y="15" width="14" height="12" fill="'+t+'"/>';
  h+='<rect x="10.5" y="27" width="6" height="10" fill="'+v.l+'"/><rect x="17.5" y="27" width="6" height="10" fill="'+v.l+'"/>';
  if(v.tie)h+='<path d="M14 15h6l-3 4z" fill="#f4f4f0"/><path d="M17 18l-1.5 2 1.5 7 1.5-7z" fill="#d92f2f"/>';
  if(k==='fire'||k==='worker')h+='<rect x="10" y="21" width="14" height="2" fill="#e8e8e0"/>';
  if(k==='police')h+='<rect x="19" y="18" width="3" height="3" fill="#f2c80f"/>';
  h+='<circle cx="17" cy="9.5" r="5" fill="#f2c80f"/>';
  if(v.hat==='helmet')h+='<path d="M11.3 9.5a5.7 5.7 0 0 1 11.4 0z" fill="'+v.hc+'"/>';
  if(v.hat==='cap')h+='<rect x="11.5" y="3.5" width="11" height="4.5" fill="'+v.hc+'"/><rect x="11" y="7.5" width="14" height="1.8" fill="'+v.hc+'"/>';
  if(v.hat==='hair')h+='<path d="M12 8.5a5 5 0 0 1 10 0z" fill="'+v.hc+'"/>';
  return s(h);
}
const SIZES=[[1,1],[1,2],[1,3],[1,4],[2,2],[2,3],[2,4],[2,6],[3,3],[3,4],[4,4],[4,8]];
let color=COLORS[0],kind='brick',bw=2,bd=4,plate=false,rot=0,del=false,bricks=[],hist=[];
const $=id=>document.getElementById(id);

/* three setup */
const cv=$('c'),stage=$('stage');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(45,1,.1,300);
scene.add(new THREE.HemisphereLight(0xffffff,0x8892a6,.85));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(14,28,10);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:1,far:80});
sun.shadow.bias=-.0004;scene.add(sun);
function theme(){const c=getComputedStyle(document.documentElement).getPropertyValue('--scene').trim();scene.background=new THREE.Color(c||'#dfe5ee')}
theme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);

/* baseplate with studs */
const base=new THREE.Mesh(new THREE.BoxGeometry(N,.5,N),new THREE.MeshStandardMaterial({color:'#4f9b5c',roughness:.7}));
base.position.y=-.25;base.receiveShadow=true;scene.add(base);
const studG=new THREE.CylinderGeometry(.3,.3,.18,16);
const bs=new THREE.InstancedMesh(studG,new THREE.MeshStandardMaterial({color:'#5aa968',roughness:.7}),N*N);
{const m=new THREE.Matrix4();let i=0;for(let x=0;x<N;x++)for(let z=0;z<N;z++){m.makeTranslation(x+.5-H2,.09,z+.5-H2);bs.setMatrixAt(i++,m)}}
bs.receiveShadow=true;scene.add(bs);
const world=new THREE.Group();scene.add(world);

/* piece geometry */
const mats={};const mat=c=>mats[c]||(mats[c]=new THREE.MeshStandardMaterial({color:c,roughness:.42}));
const glass=new THREE.MeshStandardMaterial({color:'#8fd0ff',transparent:true,opacity:.45,roughness:.1});
function build(p,c,ov){
  const g=new THREE.Group(),H=p.h*U;
  const add=(geo,m,x,y,z)=>{const o=new THREE.Mesh(geo,ov||m);o.position.set(x,y,z);if(!ov){o.castShadow=true;o.receiveShadow=true}g.add(o);return o};
  const box=(w,h,d,m,x,y,z)=>add(new THREE.BoxGeometry(w,h,d),m,x,y,z);
  if(p.k==='brick'){
    box(p.w-.04,H,p.d-.04,mat(c),0,H/2,0);
    for(let i=0;i<p.w;i++)for(let j=0;j<p.d;j++)add(studG,mat(c),i-(p.w-1)/2,H+.09,j-(p.d-1)/2);
  }else if(p.k==='tree'){
    const br=mat('#7b4a2a'),gr=mat('#2f8a46');
    add(new THREE.CylinderGeometry(.35,.45,2,12),br,0,1,0);
    [[1.5,1.7,2.7],[1.15,1.5,3.7],[.8,1.3,4.6]].forEach(([r,h,y])=>add(new THREE.ConeGeometry(r,h,14),gr,0,y,0));
  }else if(p.k==='window'){
    const f=mat(c),w=p.w,d=p.d-.1,t=.3;
    box(w-.04,t,d,f,0,t/2,0);box(w-.04,t,d,f,0,H-t/2,0);
    box(t,H,d,f,-(w/2-t/2),H/2,0);box(t,H,d,f,w/2-t/2,H/2,0);box(.12,H-2*t,d*.6,f,0,H/2,0);box(w-2*t,.12,d*.6,f,0,H/2,0);
    box(w-2*t,H-2*t,.1,glass,0,H/2,0);
  }else if(p.k==='door'){
    const f=mat('#f4f4f0'),w=p.w,d=p.d-.1,t=.3;
    box(t,H,d,f,-(w/2-t/2),H/2,0);box(t,H,d,f,w/2-t/2,H/2,0);box(w-.04,t,d,f,0,H-t/2,0);
    box(w-2*t,H-t,d*.5,mat(c),0,(H-t)/2,0);
    add(new THREE.SphereGeometry(.12,10,10),mat('#e3b505'),w/2-t-.25,H*.45,d*.3);
  }else if(FIGV[p.k]){
    const v=FIGV[p.k],sk=mat('#f2c80f'),tm=mat(v.t||c),lm=mat(v.l),hm=mat(v.hc);
    box(.36,1.2,.5,lm,-.2,.6,0);box(.36,1.2,.5,lm,.2,.6,0);
    box(.88,1.2,.55,tm,0,1.8,0);
    box(.22,1,.3,tm,-.55,1.8,0);box(.22,1,.3,tm,.55,1.8,0);
    add(new THREE.CylinderGeometry(.32,.32,.55,16),sk,0,2.67,0);
    add(new THREE.CylinderGeometry(.14,.14,.12,12),sk,0,3.0,0);
    if(v.hat==='helmet')add(new THREE.SphereGeometry(.38,14,8,0,Math.PI*2,0,Math.PI/2),hm,0,2.82,0);
    if(v.hat==='cap'){add(new THREE.CylinderGeometry(.36,.36,.24,16),hm,0,3.0,0);box(.5,.05,.3,hm,0,2.92,.38)}
    if(v.hat==='hair')add(new THREE.CylinderGeometry(.34,.34,.2,16),hm,0,2.93,0);
    if(v.tie){box(.14,.8,.05,mat('#d92f2f'),0,1.85,.29);box(.34,.3,.05,mat('#f4f4f0'),0,2.25,.29)}
    if(p.k==='police')box(.16,.16,.05,mat('#f2c80f'),.2,2.1,.29);
    if(p.k==='fire'||p.k==='worker')box(.9,.12,.58,mat('#e8e8e0'),0,1.45,0);
  }
  return g;
}
const fp=p=>p.r%2?[p.d,p.w]:[p.w,p.d];
function place(b){
  const[w,d]=fp(b);
  b.mesh=build(b,b.c);b.mesh.userData.b=b;
  b.mesh.position.set(b.x+w/2-H2,b.y*U,b.z+d/2-H2);b.mesh.rotation.y=b.r*Math.PI/2;
  world.add(b.mesh);
}
function collide(x,y,z,w,h,d){
  return bricks.some(b=>{const[bw_,bd_]=fp(b);return x<b.x+bw_&&x+w>b.x&&z<b.z+bd_&&z+d>b.z&&y<b.y+b.h&&y+h>b.y});
}

/* current piece and ghost */
const cur=()=>SPEC[kind]?{k:kind,...SPEC[kind]}:{k:'brick',w:bw,d:bd,h:plate?1:3};
const gm=new THREE.MeshBasicMaterial({transparent:true,opacity:.55,depthWrite:false});
let ghost=null,gpos=null;
const sel=new THREE.BoxHelper(new THREE.Object3D(),0xff4d4d);sel.visible=false;scene.add(sel);
function refreshGhost(){
  if(ghost)scene.remove(ghost);
  ghost=build(cur(),color,gm);ghost.rotation.y=rot*Math.PI/2;ghost.visible=false;scene.add(ghost);gpos=null;
}

/* camera orbit */
let th=.8,ph=1,dist=34;const tgt=new THREE.Vector3(0,1.5,0);
function camUpdate(){
  cam.position.set(tgt.x+dist*Math.sin(ph)*Math.sin(th),tgt.y+dist*Math.cos(ph),tgt.z+dist*Math.sin(ph)*Math.cos(th));cam.lookAt(tgt);
}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);

/* picking */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let last=null;
function pick(e){
  const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,cam);
  const hits=ray.intersectObjects([base,...bricks.map(b=>b.mesh)],true);
  if(!hits.length)return null;
  const h=hits[0];let o=h.object,b=null;while(o){if(o.userData.b){b=o.userData.b;break}o=o.parent}
  return{pt:h.point,n:h.face?h.face.normal.clone().transformDirection(h.object.matrixWorld):new THREE.Vector3(0,1,0),b};
}
function aim(){
  if(!last)return;const hit=pick(last);
  if(del){ghost.visible=false;gpos=null;if(hit&&hit.b){sel.setFromObject(hit.b.mesh);sel.visible=true;sel.userData.b=hit.b}else{sel.visible=false;sel.userData.b=null}return}
  sel.visible=false;
  if(!hit){ghost.visible=false;gpos=null;return}
  const p=cur(),w=rot%2?p.d:p.w,d=rot%2?p.w:p.d;
  let px=hit.pt.x,pz=hit.pt.z,y=0;
  if(hit.b){
    if(hit.n.y>.5)y=hit.b.y+hit.b.h;
    else{y=hit.b.y;px+=hit.n.x*w/2;pz+=hit.n.z*d/2}
  }
  let x=Math.round(px+H2-w/2),z=Math.round(pz+H2-d/2);
  x=Math.max(0,Math.min(N-w,x));z=Math.max(0,Math.min(N-d,z));
  let n=0;while(collide(x,y,z,w,p.h,d)&&n++<80)y++;
  gpos={x,y,z,w,d,ok:n<80};
  gm.color.set('#3ddc84');
  ghost.position.set(x+w/2-H2,y*U,z+d/2-H2);ghost.rotation.y=rot*Math.PI/2;ghost.visible=true;
}

/* edit actions */
const snap=()=>{hist.push(JSON.stringify(bricks.map(({mesh,...r})=>r)));if(hist.length>80)hist.shift()};
function load(arr){bricks.forEach(b=>world.remove(b.mesh));bricks=arr.map(r=>({...r}));bricks.forEach(place);ui()}
function save(){try{localStorage.setItem('brick-atolyesi',JSON.stringify(bricks.map(({mesh,...r})=>r)))}catch(e){}}
function ui(){$('cnt').textContent=bricks.length+' parça';$('mode').textContent=del?'Silme modu':'Yerleştirme';$('bDel').classList.toggle('on',del);cv.style.cursor=del?'pointer':'crosshair'}
function act(){
  if(del){const b=sel.userData.b;if(!b)return;snap();world.remove(b.mesh);bricks=bricks.filter(x=>x!==b);sel.visible=false;sel.userData.b=null}
  else{if(!gpos)return;const p=cur();snap();const b={k:p.k,w:p.w,d:p.d,h:p.h,x:gpos.x,y:gpos.y,z:gpos.z,r:rot,c:color};bricks.push(b);place(b);aim()}
  ui();save();
}
function undo(){if(!hist.length)return;load(JSON.parse(hist.pop()));save();aim()}
function rotate(){rot=(rot+1)%4;refreshGhost();aim()}
function setDel(v){del=v;refreshGhost();aim();ui()}

/* pointer */
let down=null,drag=false;
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};drag=false;cv.setPointerCapture(e.pointerId);last=e;aim()});
cv.addEventListener('pointermove',e=>{
  if(down){
    const dx=e.clientX-down.x,dy=e.clientY-down.y;
    if(drag||Math.hypot(dx,dy)>6){drag=true;th-=(e.movementX||0)*.008;ph=Math.max(.15,Math.min(1.5,ph-(e.movementY||0)*.008));ghost.visible=false;return}
  }
  last=e;aim();
});
cv.addEventListener('pointerup',e=>{if(down&&!drag){last=e;aim();act()}down=null;drag=false});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(8,Math.min(70,dist*(1+Math.sign(e.deltaY)*.08)))},{passive:false});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(k==='r')rotate();else if(k==='x')setDel(!del);
  else if(k==='z'&&(e.ctrlKey||e.metaKey)){e.preventDefault();undo()}
});

/* sidebar */
function mark(){
  document.querySelectorAll('#sizes button').forEach(b=>b.classList.toggle('on',kind==='brick'&&b.dataset.w==bw&&b.dataset.d==bd));
  document.querySelectorAll('#specials button').forEach(b=>{b.classList.toggle('on',b.dataset.k===kind);b.firstChild.innerHTML=icon(b.dataset.k,color)});
  $('tBrick').classList.toggle('on',!plate);$('tPlate').classList.toggle('on',plate);
  document.querySelectorAll('#sw button').forEach(b=>b.classList.toggle('on',b.dataset.c===color));
}
function choose(){if(del)del=false;refreshGhost();mark();ui();aim()}
SIZES.forEach(([w,d])=>{const b=document.createElement('button');b.textContent=w+'×'+d;b.dataset.w=w;b.dataset.d=d;
  b.onclick=()=>{kind='brick';bw=w;bd=d;choose()};$('sizes').appendChild(b)});
COLORS.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.dataset.c=c;b.setAttribute('aria-label','Renk '+c);
  b.onclick=()=>{color=c;choose()};$('sw').appendChild(b)});
[['tree','Ağaç'],['window','Pencere'],['door','Kapı'],['casual','Günlük'],['police','Polis'],['fire','İtfaiyeci'],['worker','İşçi'],['suit','Takımlı']].forEach(([k,l])=>{const b=document.createElement('button');b.className='ic';b.dataset.k=k;b.innerHTML='<span></span>'+l;b.onclick=()=>{kind=k;choose()};$('specials').appendChild(b)});
$('cbtn').onclick=()=>{const w=Math.max(1,Math.min(16,+$('cw').value||1)),d=Math.max(1,Math.min(16,+$('cd').value||1));kind='brick';bw=w;bd=d;choose()};

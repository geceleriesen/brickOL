@media(max-width:720px){#hud{padding:6px 10px}#hud b{font-size:0}#hud b::before{margin:0}#cnt{display:none}#tools{gap:2px;padding:4px}#tools button{min-width:38px;padding:4px 3px;font-size:9.5px}#tools kbd{display:none}#col{top:auto;bottom:174px;width:auto;right:10px}#hint{font-size:15px}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const U=.4,N=32,H2=16,$=id=>document.getElementById(id);
const COLORS=['#e4002b','#ff7a00','#ffd400','#7ac943','#00a651','#00b5b5','#0057b8','#6a3fb5','#f06eaa','#ffffff','#9aa0a8','#33363d','#7b4a2a','#e8c9a0','#a4d4ff','#c8f7a0'];
const F={w:1,d:1,h:8};
const FIGV={casual:{t:null,l:'#1f6fd1',hat:'hair',hc:'#6b4a2a'},police:{t:'#1b2a5c',l:'#1b2a5c',hat:'cap',hc:'#1b2a5c'},fire:{t:'#d92f2f',l:'#2b2f36',hat:'helmet',hc:'#f2c80f'},worker:{t:'#f28c1b',l:'#1f6fd1',hat:'helmet',hc:'#f2c80f'},suit:{t:'#2b2f36',l:'#2b2f36',hat:'hair',hc:'#4a2f1a',tie:1},doctor:{t:'#f4f4f0',l:'#2fb5b5',hat:'hair',hc:'#3a2a1a'},chef:{t:'#f4f4f0',l:'#2b2f36',hat:'tall',hc:'#fff'},astro:{t:'#f4f4f0',l:'#f4f4f0',hat:'dome'},king:{t:'#7a3fb5',l:'#2b2f36',hat:'crown',hc:'#e3b505'},pirate:{t:'#c0392b',l:'#2b2f36',hat:'cap',hc:'#1a1a1a'}};
FIGV.figure=FIGV.casual;
const SPEC={tree:{w:3,d:3,h:12},oak:{w:3,d:3,h:12},bush:{w:2,d:2,h:3},grass:{w:1,d:1,h:2},flower:{w:1,d:1,h:3},window:{w:2,d:1,h:6},winf:{w:2,d:1,h:6},door:{w:2,d:1,h:9},fence:{w:4,d:1,h:3},wheel:{w:1,d:2,h:4},bigwheel:{w:1,d:3,h:6},car:{w:2,d:4,h:3}};
Object.keys(FIGV).forEach(k=>SPEC[k]=F);
const ITEMS={build:[['window','Pencere'],['winf','Çerçevesiz'],['door','Kapı'],['fence','Çit']],nature:[['tree','Çam'],['oak','Meşe'],['bush','Çalı'],['grass','Ot'],['flower','Çiçek']],car:[['wheel','Tekerlek'],['bigwheel','Büyük teker'],['car','Araba tabanı']],fig:[['casual','Günlük'],['police','Polis'],['fire','İtfaiyeci'],['worker','İşçi'],['suit','Takımlı'],['doctor','Doktor'],['chef','Aşçı'],['astro','Astronot'],['king','Kral'],['pirate','Korsan']]};
const CATS=[['brick','Tuğla'],['plate','İnce plaka'],['slope','Çatı'],['round','Yuvarlak'],['build','Yapı'],['nature','Doğa'],['car','Tekerlek'],['fig','Figürler']];
const SIZES=[[1,1],[1,2],[1,3],[1,4],[2,2],[2,3],[2,4],[2,6],[3,3],[4,4],[4,8]];
let sm=false,chosen=null,color='#e4002b',rot=0,del=false,bricks=[],hist=[],cat='brick',sel={k:'brick',w:2,d:4,h:3};

/* renderer */
const cv=$('c'),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(42,1,.1,400);
scene.add(new THREE.HemisphereLight(0xdff0ff,0x6a7a5a,.95));
const sun=new THREE.DirectionalLight(0xfff4e0,1.1);sun.position.set(16,30,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:1,far:90});sun.shadow.bias=-.0004;sun.shadow.radius=3;scene.add(sun);
const lin=c=>new THREE.Color(c).convertSRGBToLinear();
const ground=new THREE.Mesh(new THREE.CircleGeometry(70,64),new THREE.MeshStandardMaterial({roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.52;ground.receiveShadow=true;scene.add(ground);
function theme(){ground.material.color=lin(matchMedia('(prefers-color-scheme: dark)').matches?'#2a4a3a':'#a8d88e')}
theme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
const base=new THREE.Mesh(new THREE.BoxGeometry(N,.5,N),new THREE.MeshStandardMaterial({color:lin('#4fae63'),roughness:.6}));base.position.y=-.25;base.receiveShadow=true;scene.add(base);
const studG=new THREE.CylinderGeometry(.3,.3,.18,18);studG.userData.keep=1;
const bs=new THREE.InstancedMesh(studG,new THREE.MeshStandardMaterial({color:lin('#5cbd70'),roughness:.6}),N*N);
{const m=new THREE.Matrix4();let i=0;for(let x=0;x<N;x++)for(let z=0;z<N;z++){m.makeTranslation(x+.5-H2,.09,z+.5-H2);bs.setMatrixAt(i++,m)}}
bs.receiveShadow=true;scene.add(bs);
const BASES=['#4fae63','#8a8f98','#2f6fd0','#e0c48a','#f4f4f0','#2b2f36'];
function setBase(c){base.material.color=lin(c);bs.material.color=lin(c).multiplyScalar(1.15);const h={};new THREE.Color(c).getHSL(h);gm.color=new THREE.Color().setHSL((h.h+.5)%1,1,.5).convertSRGBToLinear();document.querySelectorAll('#bsw button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));try{localStorage.setItem('brick-base',c)}catch(e){}}
const world=new THREE.Group();scene.add(world);

/* pieces */
const mats={};
const mat=c=>mats[c]||(mats[c]=new THREE.MeshPhysicalMaterial({color:lin(c),roughness:.32,clearcoat:.5,clearcoatRoughness:.35}));
const glass=new THREE.MeshStandardMaterial({color:lin('#9fd8ff'),transparent:true,opacity:.42,roughness:.08});
const edgeM=new THREE.LineBasicMaterial({color:0,transparent:true,opacity:.2});
function build(p,c,ov){
  const g=new THREE.Group(),H=p.h*U,k=p.k,v=FIGV[k];
  const add=(geo,m,x,y,z)=>{const o=new THREE.Mesh(geo,ov||m);o.position.set(x,y,z);if(!ov)o.castShadow=o.receiveShadow=true;g.add(o);return o};
  const box=(w,h,d,m,x,y,z)=>add(new THREE.BoxGeometry(w,h,d),m,x,y,z);
  const cyl=(r,r2,h,m,x,y,z,s)=>add(new THREE.CylinderGeometry(r,r2,h,s||20),m,x,y,z);
  const ball=(r,m,x,y,z)=>add(new THREE.SphereGeometry(r,16,12),m,x,y,z);
  const stud=(m,x,y,z)=>add(studG,m,x,y,z);
  const whl=(r,t,x,y,z)=>{const a=cyl(r,r,t,mat('#26292e'),x,y,z,28),b=cyl(r*.55,r*.55,t+.04,mat(c),x,y,z);a.rotation.z=b.rotation.z=Math.PI/2};
  const gr=mat('#2f8a46'),br=mat('#7b4a2a');
  if(k==='brick'){
    box(p.w-.04,H,p.d-.04,mat(c),0,H/2,0);
    if(!ov){const l=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(p.w-.04,H,p.d-.04)),edgeM);l.position.y=H/2;g.add(l)}
    for(let i=0;i<p.w;i++)for(let j=0;j<p.d;j++)stud(mat(c),i-(p.w-1)/2,H+.09,j-(p.d-1)/2);
  }else if(k==='slope'){
    const t=Math.min(1,p.d),s=new THREE.Shape(),L=p.w-.04;
    s.moveTo(-p.d/2,0);s.lineTo(p.d/2,0);s.lineTo(p.d/2,H);s.lineTo(p.d/2-t,H);s.closePath();
    const sg=new THREE.ExtrudeGeometry(s,{depth:L,bevelEnabled:false});sg.translate(0,0,-L/2);sg.rotateY(Math.PI/2);
    add(sg,mat(c),0,0,0);
    for(let i=0;i<p.w;i++)stud(mat(c),i-(p.w-1)/2,H+.09,-(p.d/2-t/2));
  }else if(k==='round'){
    cyl(p.w/2-.03,p.w/2-.03,H,mat(c),0,H/2,0,32);
    for(let i=0;i<p.w;i++)for(let j=0;j<p.w;j++){const x=i-(p.w-1)/2,z=j-(p.w-1)/2;if(Math.hypot(x,z)<=p.w/2-.25)stud(mat(c),x,H+.09,z)}
  }else if(k==='tree'){
    cyl(.35,.45,2,br,0,1,0,12);
    [[1.5,1.7,2.7],[1.15,1.5,3.7],[.8,1.3,4.6]].forEach(([r,h,y])=>add(new THREE.ConeGeometry(r,h,16),gr,0,y,0));
  }else if(k==='oak'){
    cyl(.3,.42,2.4,br,0,1.2,0,12);
    [[1.35,0,3.5,0,'#3a9a4c'],[.9,.9,3.1,.3,'#2f8a46'],[.85,-.8,3.2,-.3,'#46a85a'],[.75,.1,4.3,-.1,'#3a9a4c']].forEach(([r,x,y,z,col])=>ball(r,mat(col),x,y,z));
  }else if(k==='bush'){
    [[.7,0,.55,0,'#2f8a46'],[.55,.6,.45,.3,'#3a9a4c'],[.5,-.55,.42,-.3,'#46a85a']].forEach(([r,x,y,z,col])=>ball(r,mat(col),x,y,z));
  }else if(k==='grass'){
    for(let i=0;i<7;i++){const a=i*2.4,o=add(new THREE.ConeGeometry(.07,.7,4),mat(i%2?'#4fae3a':'#3a9a4c'),Math.cos(a)*.22,.33,Math.sin(a)*.22);o.rotation.set(Math.sin(a)*.25,0,Math.cos(a)*.25)}
  }else if(k==='flower'){
    cyl(.05,.05,.9,gr,0,.45,0,8);ball(.14,mat('#ffd400'),0,1,0);
    for(let i=0;i<6;i++){const a=i*Math.PI/3;ball(.15,mat(c),Math.cos(a)*.22,1,Math.sin(a)*.22)}
  }else if(k==='window'){
    const f=mat(c),w=p.w,d=p.d-.1,t=.3;
    box(w-.04,t,d,f,0,t/2,0);box(w-.04,t,d,f,0,H-t/2,0);box(t,H,d,f,-(w/2-t/2),H/2,0);box(t,H,d,f,w/2-t/2,H/2,0);
    box(.12,H-2*t,d*.6,f,0,H/2,0);box(w-2*t,.12,d*.6,f,0,H/2,0);box(w-2*t,H-2*t,.1,glass,0,H/2,0);
  }else if(k==='winf'){
    box(p.w-.06,H-.06,.14,glass,0,H/2,0);box(.07,H-.06,.16,mat('#f4f4f0'),0,H/2,0);box(p.w-.06,.07,.16,mat('#f4f4f0'),0,H/2,0);
  }else if(k==='door'){
    const f=mat('#f4f4f0'),w=p.w,d=p.d-.1,t=.3;
    box(t,H,d,f,-(w/2-t/2),H/2,0);box(t,H,d,f,w/2-t/2,H/2,0);box(w-.04,t,d,f,0,H-t/2,0);
    box(w-2*t,H-t,d*.5,mat(c),0,(H-t)/2,0);add(new THREE.SphereGeometry(.12,10,10),mat('#e3b505'),w/2-t-.25,H*.45,d*.3);
  }else if(k==='fence'){
    for(let i=0;i<4;i++)box(.2,H,.2,mat(c),i-1.5,H/2,0);
    box(3.9,.14,.1,mat(c),0,H*.35,0);box(3.9,.14,.1,mat(c),0,H*.75,0);
  }else if(k==='wheel'){whl(.8,.7,0,.8,0);

  }else if(k==='car'){

    [[-.85,1.3],[.85,1.3],[-.85,-1.3],[.85,-1.3]].forEach(([x,z])=>{const w=cyl(.45,.45,.4,mat('#26292e'),x,.45,z,24);w.rotation.z=Math.PI/2});
  }else if(v){

    if(k==='police')box(.16,.16,.05,mat('#f2c80f'),.2,2.1,.29);
    if(k==='fire'||k==='worker')box(.9,.12,.58,mat('#e8e8e0'),0,1.45,0);
    if(k==='doctor')box(.1,.34,.05,mat('#d92f2f'),0,2.0,.29);

}
const fp=p=>p.r%2?[p.d,p.w]:[p.w,p.d];
function place(b){const[w,d]=fp(b);b.mesh=build(b,b.c);b.mesh.userData.b=b;b.mesh.position.set(b.x+w/2-H2,b.y*U,b.z+d/2-H2);b.mesh.rotation.y=b.r*Math.PI/2;world.add(b.mesh)}
function collide(x,y,z,w,h,d){return bricks.some(b=>{const[bw,bd]=fp(b);return x<b.x+bw&&x+w>b.x&&z<b.z+bd&&z+d>b.z&&y<b.y+b.h&&y+h>b.y})}

/* icons rendered from the real pieces */
const pr=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});pr.setSize(104,104);pr.outputEncoding=THREE.sRGBEncoding;
const ps=new THREE.Scene(),pc=new THREE.PerspectiveCamera(30,1,.1,100);
ps.add(new THREE.HemisphereLight(0xffffff,0x8892a6,1.1));{const l=new THREE.DirectionalLight(0xffffff,1);l.position.set(3,6,4);ps.add(l)}
function icon(p){
  const g=build(p,color);ps.add(g);
  const bb=new THREE.Box3().setFromObject(g),c=bb.getCenter(new THREE.Vector3()),s=bb.getSize(new THREE.Vector3()),r=Math.max(s.x,s.y,s.z);
  pc.position.copy(c).add(new THREE.Vector3(.8,.7,1).normalize().multiplyScalar(r*2.5));pc.lookAt(c);
  pr.render(ps,pc);const u=pr.domElement.toDataURL();ps.remove(g);
  g.traverse(o=>{if(o.geometry&&!o.geometry.userData.keep)o.geometry.dispose()});return u;
}

/* ghost + picking */
const gm=new THREE.MeshBasicMaterial({transparent:true,opacity:.72,depthWrite:false});
let ghost=null,gpos=null,last=null;
const selBox=new THREE.BoxHelper(new THREE.Object3D(),0xff4d4d);selBox.visible=false;scene.add(selBox);
const pickBox=new THREE.BoxHelper(new THREE.Object3D(),0x00d4ff);pickBox.visible=false;scene.add(pickBox);
function showPick(){if(chosen){pickBox.setFromObject(chosen.mesh);pickBox.visible=true}else pickBox.visible=false}
function refreshGhost(){if(ghost)scene.remove(ghost);ghost=build(sel,color,gm);ghost.rotation.y=rot*Math.PI/2;ghost.visible=false;scene.add(ghost);gpos=null}
let th=.8,ph=1.02,dist=38;const tgt=new THREE.Vector3(0,1.5,0);
const camUpdate=()=>{cam.position.set(tgt.x+dist*Math.sin(ph)*Math.sin(th),tgt.y+dist*Math.cos(ph),tgt.z+dist*Math.sin(ph)*Math.cos(th));cam.lookAt(tgt)};
function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(e){
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,cam);
  const hits=ray.intersectObjects([base,...bricks.map(b=>b.mesh)],true);if(!hits.length)return null;
  const h=hits[0];let o=h.object,b=null;while(o){if(o.userData.b){b=o.userData.b;break}o=o.parent}
  return{pt:h.point,n:h.face?h.face.normal.clone().transformDirection(h.object.matrixWorld):new THREE.Vector3(0,1,0),b};
}
function aim(){
  if(!last)return;const hit=pick(last);
  if(del||sm){ghost.visible=false;gpos=null;if(hit&&hit.b){selBox.material.color.set(del?0xff4d4d:0xffa000);selBox.setFromObject(hit.b.mesh);selBox.visible=true;selBox.userData.b=hit.b}else{selBox.visible=false;selBox.userData.b=null}return}
  selBox.visible=false;if(!hit){ghost.visible=false;gpos=null;return}
  const w=rot%2?sel.d:sel.w,d=rot%2?sel.w:sel.d;let px=hit.pt.x,pz=hit.pt.z,y=0;
  if(hit.b){if(hit.n.y>.5)y=hit.b.y+hit.b.h;else{y=hit.b.y;px+=hit.n.x*w/2;pz+=hit.n.z*d/2}}
  let x=Math.max(0,Math.min(N-w,Math.round(px+H2-w/2))),z=Math.max(0,Math.min(N-d,Math.round(pz+H2-d/2)));
  let n=0;while(collide(x,y,z,w,sel.h,d)&&n++<80)y++;
  gpos={x,y,z};ghost.position.set(x+w/2-H2,y*U,z+d/2-H2);ghost.rotation.y=rot*Math.PI/2;ghost.visible=true;
}

/* edit */
const snap=()=>{hist.push(JSON.stringify(bricks.map(({mesh,...r})=>r)));if(hist.length>80)hist.shift()};
function load(a){chosen=null;pickBox.visible=false;bricks.forEach(b=>world.remove(b.mesh));bricks=a.map(r=>({...r}));bricks.forEach(place);ui()}
function save(){try{localStorage.setItem('brick-atolyesi',JSON.stringify(bricks.map(({mesh,...r})=>r)))}catch(e){}}
function ui(){$('cnt').textContent=bricks.length+' parça';$('hint').style.display=bricks.length?'none':'';document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',(b.dataset.a==='del'&&del)||(b.dataset.a==='sel'&&sm)));cv.style.cursor=del||sm?'pointer':'crosshair'}
function act(){
  if(sm){chosen=selBox.userData.b||null;showPick();return}
  if(del){const b=selBox.userData.b;if(!b)return;snap();world.remove(b.mesh);bricks=bricks.filter(x=>x!==b);selBox.visible=false;selBox.userData.b=null}
  else{if(!gpos)return;snap();const b={k:sel.k,w:sel.w,d:sel.d,h:sel.h,x:gpos.x,y:gpos.y,z:gpos.z,r:rot,c:color};bricks.push(b);place(b);aim()}
  ui();save();
}
const undo=()=>{if(!hist.length)return;load(JSON.parse(hist.pop()));save();aim()};
const rotate=()=>{if(sm&&chosen)return rotChosen();rot=(rot+1)%4;refreshGhost();aim()};
function setMode(m){del=m==='del';sm=m==='sel';if(!sm){chosen=null;showPick()}selBox.visible=false;selBox.userData.b=null;refreshGhost();aim();ui();if(sm)flash('Parçaya tıkla, R ile döndür, Delete ile sil')}
const setDel=v=>setMode(v?'del':'place');
function rotChosen(){
  const b=chosen;if(!b)return;const[w,d]=fp(b),nr=(b.r+1)%4,[nw,nd]=fp({...b,r:nr});
  const nx=Math.max(0,Math.min(N-nw,Math.round(b.x+w/2-nw/2))),nz=Math.max(0,Math.min(N-nd,Math.round(b.z+d/2-nd/2)));
  const i=bricks.indexOf(b);bricks.splice(i,1);const ok=!collide(nx,b.y,nz,nw,b.h,nd);bricks.splice(i,0,b);
  if(!ok){flash('Burada dönemiyor, yer dolu');return}
  snap();b.x=nx;b.z=nz;b.r=nr;world.remove(b.mesh);place(b);showPick();save();
}
function delChosen(){if(!chosen)return;snap();world.remove(chosen.mesh);bricks=bricks.filter(x=>x!==chosen);chosen=null;showPick();ui();save()}
const flash=t=>{$('cnt').textContent=t;$('cnt').style.display='inline';setTimeout(()=>{ui();$('cnt').style.display=''},1800)};

/* pointer */
let down=null,drag=false,pd=0;const ptr=new Map();
cv.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,e);down={x:e.clientX,y:e.clientY};drag=false;cv.setPointerCapture(e.pointerId);last=e;aim()});
cv.addEventListener('pointermove',e=>{
  if(ptr.size===2){ptr.set(e.pointerId,e);const[a,b]=[...ptr.values()],d2=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)dist=Math.max(8,Math.min(80,dist*pd/d2));pd=d2;drag=true;ghost.visible=false;return}
  if(ptr.has(e.pointerId))ptr.set(e.pointerId,e);
  if(down&&(drag||Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)){drag=true;th-=(e.movementX||0)*.008;ph=Math.max(.15,Math.min(1.5,ph-(e.movementY||0)*.008));ghost.visible=false;return}
  last=e;aim();
});
const up=e=>{ptr.delete(e.pointerId);pd=0;if(down&&!drag&&!ptr.size){last=e;aim();act()}down=null;drag=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);down=null;drag=false});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(8,Math.min(80,dist*(1+Math.sign(e.deltaY)*.08)))},{passive:false});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
  if(e.ctrlKey||e.metaKey){if(k==='z'){e.preventDefault();undo()}return}
  ({r:rotate,x:()=>setMode(del?'place':'del'),s:()=>setMode(sm?'place':'sel'),t:ACT.clr,c:ACT.clr,p:ACT.png,l:ACT.link,escape:()=>setMode('place'),delete:delChosen,backspace:delChosen})[k]?.();});

/* UI */
const key=p=>p.k+p.w+'x'+p.d+'x'+p.h,clamp=n=>Math.max(1,Math.min(16,n||1));
function items(){
  if(cat==='brick'||cat==='plate')return SIZES.map(([w,d])=>({k:'brick',w,d,h:cat==='plate'?1:3,l:w+'×'+d}));
  if(cat==='slope')return SIZES.filter(s=>s[1]>1).map(([w,d])=>({k:'slope',w,d,h:3,l:w+'×'+d}));
  if(cat==='round')return[1,2,3,4].map(w=>({k:'round',w,d:w,h:3,l:w+'×'+w}));
  return ITEMS[cat].map(([k,l])=>({k,...SPEC[k],l}));
}
function tray(){
  const t=$('tray');t.innerHTML='';
  items().forEach(p=>{
    const b=document.createElement('button');b.className='it'+(key(p)===key(sel)?' on':'');b.innerHTML='<img alt="" src="'+icon(p)+'">'+p.l;
    b.onclick=()=>{sel={k:p.k,w:p.w,d:p.d,h:p.h};setMode('place');[...t.querySelectorAll('.it')].forEach(x=>x.classList.toggle('on',x===b))};t.appendChild(b);
  });
  if(['brick','plate','slope','round'].includes(cat)){
    const c=document.createElement('div');c.className='cs';c.innerHTML='<div><input type="number" id="cw" min="1" max="16" value="2" aria-label="Genişlik">×<input type="number" id="cd" min="1" max="16" value="5" aria-label="Uzunluk"></div><button>Özel ölçü</button>';
    c.lastChild.onclick=()=>{const w=clamp(+$('cw').value),d=cat==='round'?w:clamp(+$('cd').value);sel={k:cat==='plate'?'brick':cat,w,d,h:cat==='plate'?1:3};setMode('place');[...t.querySelectorAll('.it')].forEach(x=>x.classList.remove('on'))};t.appendChild(c);
  }
  [...$('tabs').querySelectorAll('[data-c]')].forEach(b=>b.classList.toggle('on',b.dataset.c===cat));
}
CATS.forEach(([c,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.c=c;b.onclick=()=>{cat=c;$('dock').classList.remove('min');tray()};$('tabs').appendChild(b)});
{const f=document.createElement('button');f.className='fold';f.textContent='▾';f.setAttribute('aria-label','Parça çubuğunu aç/kapat');f.onclick=()=>{const m=$('dock').classList.toggle('min');f.textContent=m?'▴':'▾'};$('tabs').appendChild(f)}
let tm;function setColor(c){color=c;if(sm&&chosen){chosen.c=c;world.remove(chosen.mesh);place(chosen);showPick();save()}$('cp').value=c;$('hex').value=c.toUpperCase();document.querySelectorAll('#sw button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));refreshGhost();clearTimeout(tm);tm=setTimeout(tray,120)}
COLORS.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.dataset.c=c;b.setAttribute('aria-label','Renk '+c);b.onclick=()=>setColor(c);$('sw').appendChild(b)});
$('cp').oninput=e=>setColor(e.target.value);
$('hex').onchange=e=>{let v=e.target.value.trim();if(v[0]!=='#')v='#'+v;if(/^#[0-9a-f]{6}$/i.test(v))setColor(v.toLowerCase());else e.target.value=color.toUpperCase()};
$('cf').onclick=()=>{const m=$('col').classList.toggle('min');$('cf').textContent=m?'+':'−'};
if(innerWidth<720){$('col').classList.add('min');$('cf').textContent='+'}
const ACT={
  undo:undo,rot:rotate,del:()=>setMode(del?'place':'del'),sel:()=>setMode(sm?'place':'sel'),
  clr:()=>{if(bricks.length&&confirm('Tüm parçalar silinsin mi?')){snap();load([]);save()}},
  png:()=>{ghost.visible=false;selBox.visible=false;renderer.render(scene,cam);const o=document.createElement('canvas');o.width=cv.width;o.height=cv.height;const x=o.getContext('2d');
    const g=x.createLinearGradient(0,0,0,o.height);g.addColorStop(0,getComputedStyle(document.body).getPropertyValue('--s1').trim()||'#7cc7ff');g.addColorStop(1,getComputedStyle(document.body).getPropertyValue('--s2').trim()||'#eaf7ff');
    x.fillStyle=g;x.fillRect(0,0,o.width,o.height);x.drawImage(cv,0,0);o.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='brick-atolyesi.png';a.click();flash('PNG hazır')})},
  link:async()=>{const s=btoa(unescape(encodeURIComponent(JSON.stringify(bricks.map(b=>[b.k,b.w,b.d,b.h,b.x,b.y,b.z,b.r,b.c])))));const u=location.href.split('#')[0]+'#s='+s;try{await navigator.clipboard.writeText(u);flash('Link kopyalandı')}catch(e){prompt('Linki kopyalayın',u)}}
};
[['undo','↶','Geri al','Ctrl Z'],['rot','↻','Döndür','R'],['sel','◎','Seç','S'],['del','⌫','Sil','X'],['clr','✖','Temizle','T'],['png','⬇','PNG','P'],['link','↗','Link','L']].forEach(([a,i,l,kk])=>{
  const b=document.createElement('button');b.dataset.a=a;b.innerHTML='<i>'+i+'</i>'+l+'<kbd>'+kk+'</kbd>';b.onclick=ACT[a];$('tools').appendChild(b)});

/* start */
try{const m=location.hash.match(/^#s=(.+)$/);if(m)load(JSON.parse(decodeURIComponent(escape(atob(m[1])))).map(a=>({k:a[0],w:a[1],d:a[2],h:a[3],x:a[4],y:a[5],z:a[6],r:a[7],c:a[8]})));else{const s=localStorage.getItem('brick-atolyesi');if(s)load(JSON.parse(s))}}catch(e){}
BASES.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.dataset.c=c;b.setAttribute('aria-label','Zemin '+c);b.onclick=()=>setBase(c);$('bsw').appendChild(b)});
let sb=BASES[0];try{sb=localStorage.getItem('brick-base')||sb}catch(e){}
resize();setColor(color);setBase(sb);tray();ui();
(function loop(){requestAnimationFrame(loop);camUpdate();if(selBox.visible)selBox.update();renderer.render(scene,cam)})();
})();
</script>
</body>
</html>
